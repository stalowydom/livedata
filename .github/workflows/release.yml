name: Release

# Nowe wydanie powstaje automatycznie, gdy na main zmieni się "Version:" w pliku wtyczki.
on:
  push:
    branches: [main]
    paths: ['stalowydom-live/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "ver=$(grep -m1 '^Version:' stalowydom-live/stalowydom-live.php | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Skip if release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.ver }}" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build and publish
        if: steps.exists.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r stalowydom-live.zip stalowydom-live
          gh release create "v${{ steps.v.outputs.ver }}" stalowydom-live.zip --target "$GITHUB_SHA" --title "${{ steps.v.outputs.ver }}" --generate-notes
